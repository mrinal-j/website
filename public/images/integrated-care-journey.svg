<!-- Filler illustration: the current patient journey.
     Four separate visits across four days, one specialty each, with families
     dropping out at every handover. Placeholder, to be replaced. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img"
     aria-label="The current journey: four separate hospital visits across four days, one specialty each, with families falling out of the system at each handover.">
  <defs>
    <style>
      .lbl { font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; font-size: 13px; font-weight: 600; fill: #111; }
      .sub { font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; font-size: 11px; fill: #6a6a6a; }
      .day { font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; font-size: 10px; font-weight: 700; fill: #8a8a8a; letter-spacing: 0.08em; }
      .drop { font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; font-size: 10px; fill: #b0b0b0; font-style: italic; }
      .card { fill: #fff; stroke: #e0e0e0; }
      .path { stroke: #c9c9c9; stroke-width: 1.5; fill: none; }
      .fall { stroke: #d8d8d8; stroke-width: 1.25; fill: none; stroke-dasharray: 3 4; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L6 4 L0 7 z" fill="#c9c9c9"/>
    </marker>
  </defs>

  <!-- the family, at the start -->
  <g transform="translate(24,150)">
    <circle cx="16" cy="12" r="9" fill="#4450ea"/>
    <path d="M2 40 a14 14 0 0 1 28 0 z" fill="#4450ea"/>
    <circle cx="36" cy="20" r="6" fill="#9aa2f4"/>
    <path d="M27 40 a9 9 0 0 1 18 0 z" fill="#9aa2f4"/>
    <text class="sub" x="0" y="60">One child,</text>
    <text class="sub" x="0" y="75">one family</text>
  </g>

  <!-- four visits -->
  <g>
    <!-- visit 1 -->
    <g transform="translate(130,120)">
      <text class="day" x="0" y="-14">DAY 1</text>
      <rect class="card" x="0" y="0" width="104" height="72" rx="8"/>
      <rect x="16" y="20" width="24" height="24" rx="4" fill="#e8eaff"/>
      <text class="lbl" x="16" y="60">Orthopaedics</text>
      <circle cx="82" cy="26" r="10" fill="#4450ea" opacity="0.9"/>
    </g>
    <!-- visit 2 -->
    <g transform="translate(258,120)">
      <text class="day" x="0" y="-14">DAY 2</text>
      <rect class="card" x="0" y="0" width="104" height="72" rx="8"/>
      <rect x="16" y="20" width="24" height="24" rx="4" fill="#e8eaff"/>
      <text class="lbl" x="16" y="60">Therapy</text>
      <circle cx="82" cy="26" r="10" fill="#4450ea" opacity="0.7"/>
    </g>
    <!-- visit 3 -->
    <g transform="translate(386,120)">
      <text class="day" x="0" y="-14">DAY 3</text>
      <rect class="card" x="0" y="0" width="104" height="72" rx="8"/>
      <rect x="16" y="20" width="24" height="24" rx="4" fill="#e8eaff"/>
      <text class="lbl" x="16" y="60">ENT</text>
      <circle cx="82" cy="26" r="10" fill="#4450ea" opacity="0.45"/>
    </g>
    <!-- visit 4 -->
    <g transform="translate(514,120)">
      <text class="day" x="0" y="-14">DAY 4</text>
      <rect class="card" x="0" y="0" width="104" height="72" rx="8"/>
      <rect x="16" y="20" width="24" height="24" rx="4" fill="#e8eaff"/>
      <text class="lbl" x="16" y="60">Psychiatry</text>
      <circle cx="82" cy="26" r="10" fill="#4450ea" opacity="0.2"/>
    </g>
  </g>

  <!-- the path between visits -->
  <path class="path" d="M74 168 L128 158" marker-end="url(#arrow)"/>
  <path class="path" d="M236 156 L254 156" marker-end="url(#arrow)"/>
  <path class="path" d="M364 156 L382 156" marker-end="url(#arrow)"/>
  <path class="path" d="M492 156 L510 156" marker-end="url(#arrow)"/>

  <!-- families falling out at each handover -->
  <g>
    <path class="fall" d="M245 200 L245 244"/>
    <path class="fall" d="M373 200 L373 244"/>
    <path class="fall" d="M501 200 L501 244"/>
    <circle cx="245" cy="252" r="5" fill="#dcdcdc"/>
    <circle cx="373" cy="252" r="5" fill="#dcdcdc"/>
    <circle cx="501" cy="252" r="5" fill="#dcdcdc"/>
    <text class="drop" x="196" y="278">families fall out at each handover</text>
  </g>

  <!-- the cost line -->
  <g transform="translate(130,330)">
    <line x1="0" y1="0" x2="488" y2="0" stroke="#ebebeb" stroke-width="1"/>
    <text class="sub" x="0" y="24">4 departments</text>
    <text class="sub" x="128" y="24">4 appointments</text>
    <text class="sub" x="256" y="24">4 separate days</text>
    <text class="sub" x="384" y="24">4 days of lost pay</text>
  </g>

  <!-- placeholder note -->
  <text class="drop" x="24" y="432">Placeholder illustration, to be replaced</text>
</svg>
