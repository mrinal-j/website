<!-- Filler illustration: the current patient journey.
     Five separate visits across five days, one specialty each, with families
     dropping out at every handover. Placeholder, to be replaced. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img"
     aria-label="The current journey: five separate hospital visits across five days, one specialty each, with families falling out of the system at each handover.">
  <defs>
    <style>
      .lbl { font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; font-size: 12px; font-weight: 600; fill: #111; }
      .sub { font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; font-size: 11px; fill: #6a6a6a; }
      .day { font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; font-size: 10px; font-weight: 700; fill: #8a8a8a; letter-spacing: 0.08em; }
      .drop { font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; font-size: 10px; fill: #b0b0b0; font-style: italic; }
      .card { fill: #fff; stroke: #e0e0e0; }
      .path { stroke: #c9c9c9; stroke-width: 1.5; fill: none; }
      .fall { stroke: #d8d8d8; stroke-width: 1.25; fill: none; stroke-dasharray: 3 4; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L6 4 L0 7 z" fill="#c9c9c9"/>
    </marker>
  </defs>

  <!-- the family, at the start -->
  <g transform="translate(20,150)">
    <circle cx="16" cy="12" r="9" fill="#4450ea"/>
    <path d="M2 40 a14 14 0 0 1 28 0 z" fill="#4450ea"/>
    <circle cx="36" cy="20" r="6" fill="#9aa2f4"/>
    <path d="M27 40 a9 9 0 0 1 18 0 z" fill="#9aa2f4"/>
    <text class="sub" x="0" y="60">One child,</text>
    <text class="sub" x="0" y="75">one family</text>
  </g>

  <!-- five visits, one specialty each. The child's marker fades along the
       row: the further into the sequence, the fewer families are left. -->
  <g>
    <g transform="translate(112,120)">
      <text class="day" x="0" y="-14">DAY 1</text>
      <rect class="card" x="0" y="0" width="112" height="72" rx="8"/>
      <rect x="14" y="18" width="22" height="22" rx="4" fill="#e8eaff"/>
      <text class="lbl" x="14" y="60">Paediatrics</text>
      <circle cx="88" cy="26" r="10" fill="#4450ea" opacity="0.95"/>
    </g>
    <g transform="translate(240,120)">
      <text class="day" x="0" y="-14">DAY 2</text>
      <rect class="card" x="0" y="0" width="112" height="72" rx="8"/>
      <rect x="14" y="18" width="22" height="22" rx="4" fill="#e8eaff"/>
      <text class="lbl" x="14" y="60">Orthopaedics</text>
      <circle cx="88" cy="26" r="10" fill="#4450ea" opacity="0.78"/>
    </g>
    <g transform="translate(368,120)">
      <text class="day" x="0" y="-14">DAY 3</text>
      <rect class="card" x="0" y="0" width="112" height="72" rx="8"/>
      <rect x="14" y="18" width="22" height="22" rx="4" fill="#e8eaff"/>
      <text class="lbl" x="14" y="60">Therapy</text>
      <circle cx="88" cy="26" r="10" fill="#4450ea" opacity="0.58"/>
    </g>
    <g transform="translate(496,120)">
      <text class="day" x="0" y="-14">DAY 4</text>
      <rect class="card" x="0" y="0" width="112" height="72" rx="8"/>
      <rect x="14" y="18" width="22" height="22" rx="4" fill="#e8eaff"/>
      <text class="lbl" x="14" y="60">ENT</text>
      <circle cx="88" cy="26" r="10" fill="#4450ea" opacity="0.36"/>
    </g>
    <g transform="translate(624,120)">
      <text class="day" x="0" y="-14">DAY 5</text>
      <rect class="card" x="0" y="0" width="112" height="72" rx="8"/>
      <rect x="14" y="18" width="22" height="22" rx="4" fill="#e8eaff"/>
      <text class="lbl" x="14" y="60">Psychiatry</text>
      <circle cx="88" cy="26" r="10" fill="#4450ea" opacity="0.16"/>
    </g>
  </g>

  <!-- the path between visits -->
  <path class="path" d="M70 168 L110 158" marker-end="url(#arrow)"/>
  <path class="path" d="M226 156 L236 156" marker-end="url(#arrow)"/>
  <path class="path" d="M354 156 L364 156" marker-end="url(#arrow)"/>
  <path class="path" d="M482 156 L492 156" marker-end="url(#arrow)"/>
  <path class="path" d="M610 156 L620 156" marker-end="url(#arrow)"/>

  <!-- families falling out at each handover -->
  <g>
    <path class="fall" d="M231 200 L231 244"/>
    <path class="fall" d="M359 200 L359 244"/>
    <path class="fall" d="M487 200 L487 244"/>
    <path class="fall" d="M615 200 L615 244"/>
    <circle cx="231" cy="252" r="5" fill="#dcdcdc"/>
    <circle cx="359" cy="252" r="5" fill="#dcdcdc"/>
    <circle cx="487" cy="252" r="5" fill="#dcdcdc"/>
    <circle cx="615" cy="252" r="5" fill="#dcdcdc"/>
    <text class="drop" x="286" y="280">families fall out at each handover</text>
  </g>

  <!-- what the journey costs the family -->
  <g transform="translate(112,336)">
    <line x1="0" y1="0" x2="624" y2="0" stroke="#ebebeb" stroke-width="1"/>
    <text class="sub" x="0" y="24">5 departments</text>
    <text class="sub" x="160" y="24">5 appointments</text>
    <text class="sub" x="320" y="24">5 separate days</text>
    <text class="sub" x="480" y="24">5 days of lost pay</text>
  </g>

  <!-- placeholder note -->
  <text class="drop" x="20" y="442">Placeholder illustration, to be replaced</text>
</svg>
